name: Probe IMDb access
on:
  workflow_dispatch:
    inputs:
      user:
        description: IMDb user id (ur...)
        required: false
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch IMDb pages
        env:
          UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36
          USER_ID: ${{ inputs.user }}
        run: |
          for u in "https://www.imdb.com/title/tt0056443/" "https://www.imdb.com/chart/top/" ${USER_ID:+"https://www.imdb.com/user/$USER_ID/ratings/" "https://www.imdb.com/user/$USER_ID/ratings/export"}; do
            code=$(curl -sS -L -o page.html -w '%{http_code}' -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' "$u")
            echo "== $u -> $code, $(wc -c < page.html) bytes"
            grep -o '<title>[^<]*' page.html | head -1
            grep -c '__NEXT_DATA__' page.html || true
            head -c 300 page.html | tr '\n' ' '; echo
          done
